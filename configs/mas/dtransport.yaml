# Copy this file to MAS-public/configs/controllers/dtransport.yaml
# Intentionally conservative for real robots.
#
# robot_radius must be the physical chassis radius. C1 then fixes the admissible
# cage_offset band to (robot_radius - delta_max, robot_radius); the controller
# refuses to start outside it.

hold_enabled: false

# perception
sensor_range: 0.70
ray_count: 72
residual_tolerance: 0.03
min_confidence: 0.15

# communication / coverage  (local_radius <= comm_range / 2)
comm_range: 1.30
local_radius: 0.60
grid_resolution: 20

# map
voxel_size: 0.05
age_decay: 0.35

# density
density_mode: offset
cage_offset: 0.155
sigma: 0.18

# safety
robot_radius: 0.18
delta_max: 0.04
d_min: 0.42
gamma_agent: 5.0
gamma_obj: 3.0
rho: 0.04
max_speed: 0.18
backend: qp

# gains
kp_explore: 0.15
kp_cage: 0.55
kp_transport: 0.08

max_wz: 0.60

# Lab debug option: a known polygon until object perception is available.
# Coordinates are in the MAS world frame.
virtual_object:
  enabled: false
  id: cargo_0
  vertices:
    - [1.0, 1.0]
    - [1.7, 1.0]
    - [1.7, 1.5]
    - [1.0, 1.5]
  transport_direction: [1.0, 0.0]
