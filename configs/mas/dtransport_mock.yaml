# Mock MAS pipeline config.
# Used by scripts/run_mock_mas_pipeline.py only; it does not modify the real
# MAS / RoboMaster configuration.
#
# The C1 contact/safety contract is asserted when the controller is built, so
# cage_offset must satisfy  r_safe = robot_radius - delta_max < cage_offset < robot_radius.

hold_enabled: false

# perception
sensor_range: 1.20
ray_count: 72
residual_tolerance: 0.03
min_confidence: 0.15

# communication / coverage  (local_radius <= comm_range / 2)
comm_range: 2.40
local_radius: 1.10
grid_resolution: 22

# map
voxel_size: 0.06
age_decay: 0.30

# density
density_mode: offset
cage_offset: 0.135
sigma: 0.20

# safety
robot_radius: 0.16
delta_max: 0.05
d_min: 0.30
gamma_agent: 6.0
gamma_obj: 4.0
rho: 0.05
max_speed: 0.30
backend: qp

# gains
kp_explore: 0.20
kp_cage: 1.20
kp_transport: 0.0

max_wz: 0.60

virtual_object:
  enabled: true
  id: cargo_0
  vertices:
    - [3.10, 4.55]
    - [4.45, 4.30]
    - [5.10, 4.90]
    - [4.80, 5.75]
    - [3.70, 6.05]
    - [3.05, 5.30]
  transport_direction: [0.0, 1.0]
