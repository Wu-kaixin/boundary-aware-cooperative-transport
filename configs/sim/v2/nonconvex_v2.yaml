# Non-convex polygon cargo, contact-only directional transport.
#
# Two reflex corners rather than one, so the offset self-intersection and the
# tangential-window admission rule of the object barrier are both exercised harder
# than on the L shape.
#
# Every field that decides what the run means is written down: the transport
# engine, the QP backend, the robot radius and the penetration budget. The
# controller asserts the C1 contact/safety contract at construction, so
#     r_safe = robot_radius - delta_max = 0.11  <  cage_offset  <  robot_radius = 0.16
# with gamma_obj * (cage_offset - r_safe) = 0.200 > rho = 0.05,
#      d_min >= 2 * robot_radius        so robot discs cannot overlap, and
#      lead_offset > robot_radius       so the leading arc guides without resisting.

paper: true
dt: 0.05

domain:
  xmin: 0.0
  xmax: 8.0
  ymin: 0.0
  ymax: 8.0

agents:
  # 16 robots on an 8.05 m cage ring: 16 * d_min = 5.44 m of ring, so both the
  # contact arc and the lifted leading arc fit without pinning anyone against a
  # neighbour.
  count: 16
  # Robots deployed around the work area rather than as a block on one side.
  # Rejection sampling guarantees the initial separation, and the environment
  # refuses to start from a state that already violates d_min: a barrier
  # certificate says nothing about a run that begins outside the safe set.
  layout: scatter
  center: [2.60, 2.60]
  # radius_max is bounded by comm_range so that no robot starts outside the
  # communication graph: an isolated robot never receives a relayed observation and
  # explores forever, which shows up as a permanently unengaged robot rather than
  # as an error.
  radius_min: 1.50
  radius_max: 2.30
  min_separation: 0.40

cargoes:
  - id: cargo_0
    shape: nonconvex
    center: [2.60, 2.60]
    scale: 1.60
    # Surface density sets the mass, and the mass sets the Coulomb breakaway
    # force. Chosen together with transport.stiffness and ground_friction so that
    # one robot at the cage ring cannot move the object and roughly three aligned
    # robots can:  mu_g * m * g / (k_p * (r_robot - d_c)) ~ 2.5 robots.
    surface_density: 2.0
    transport_direction: [1.0, 0.4]

controller:
  task_mode: transport

  # S2 perception
  sensor_range: 1.20
  ray_count: 96
  range_noise_std: 0.010
  pca_neighbors: 5
  residual_tolerance: 0.030
  min_confidence: 0.15

  # communication
  comm_range: 1.60

  # S3 map
  voxel_size: 0.06
  age_decay: 0.30
  max_voxels_per_object: 600

  # S4 density
  density_mode: offset
  cage_offset: 0.135
  # Leading arc, outside contact. A uniform cage of rigid kinematic robots cannot
  # be transported: the robots in front are in contact too and their normal force
  # cancels the pushing arc almost exactly.
  lead_offset: 0.22
  lead_threshold: 0.35
  sigma: 0.20
  base_density: 0.001
  gap_gain: 0.6
  gap_radius: 0.35

  # S5 coverage  (local_radius <= comm_range / 2)
  local_radius: 0.80
  grid_resolution: 24
  approach_mass_ratio: 3.0
  redeploy_gap_ratio: 0.15

  # S1 safety
  robot_radius: 0.16
  delta_max: 0.05
  d_min: 0.34
  gamma_agent: 6.0
  gamma_obj: 8.0
  rho: 0.05
  max_speed: 0.30
  backend: qp
  object_row_range: 0.60
  object_row_window: 0.28

  # gains
  kp_explore: 0.25
  kp_cage: 0.90
  kp_transport: 0.60

  # S7 transport gating
  push_side_threshold: 0.35
  min_push_agents: 4
  contact_band_tolerance: 0.08

transport:
  engine: penalty
  stiffness: 500.0
  damping: 12.0
  friction: 0.6
  tangential_stiffness: 60.0
  # Coulomb floor friction, not viscous drag: below mu_g * m * g the object does
  # not move at all. Viscous drag gives the cargo a terminal speed above the
  # robots' own speed limit, so it is kicked away by the first robot to touch it
  # and the cage can never close.
  ground_friction: 0.77
  gravity: 9.81
  substeps: 4

evaluation:
  contact_radius: 0.42
  j_min: 0.15
  efficiency_min: 0.7
  displacement_gate: 0.1
