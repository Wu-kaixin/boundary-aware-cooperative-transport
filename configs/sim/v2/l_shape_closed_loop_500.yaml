# Fast 500-frame closed-loop development scenario.
# The cargo direction is task state only; the penalty engine never reads it.
paper: true
dt: 0.05

domain: {xmin: 0.0, xmax: 8.0, ymin: 0.0, ymax: 8.0}

agents:
  count: 12
  # Search-ring deployment keeps the communication graph connected without
  # giving the controller the cargo outline or contact locations.  The ring is
  # outside sensing range for part of the irregular boundary, so agents still
  # transition through discovery/approach before enclosure.
  layout: ring
  center: [2.80, 2.80]
  radius: 2.20
  phase: 0.15

cargoes:
  - id: cargo_0
    shape: l_shape
    center: [2.60, 2.60]
    scale: 1.50
    surface_density: 2.0

task:
  random_goal:
    enabled: true
    angle_min_deg: -10.0
    angle_max_deg: 60.0
    target_distance: 0.30
    wall_margin: 1.00
    max_attempts: 128

controller:
  task_mode: transport

  sensor_range: 1.20
  ray_count: 72
  range_noise_std: 0.010
  pca_neighbors: 5
  residual_tolerance: 0.030
  min_confidence: 0.15
  comm_range: 1.60

  voxel_size: 0.07
  age_decay: 0.45
  max_voxels_per_object: 420

  density_mode: offset
  cage_offset: 0.135
  lead_offset: 0.22
  lead_threshold: 0.35
  sigma: 0.20
  base_density: 0.001
  gap_gain: 0.6
  gap_radius: 0.35

  local_radius: 0.80
  grid_resolution: 18
  approach_mass_ratio: 3.0
  redeploy_gap_ratio: 0.15

  robot_radius: 0.16
  delta_max: 0.05
  d_min: 0.32
  gamma_agent: 6.0
  gamma_obj: 8.0
  rho: 0.05
  max_speed: 0.30
  backend: qp
  max_object_rows: 4
  object_row_range: 0.60
  object_row_window: 0.20
  # Keep only locally visible/supporting half-spaces.  A relayed point on the
  # back face of a thin L-shape has n.(p-b)<0 and must not constrain this robot.
  object_row_inner_limit: 0.0

  kp_explore: 0.25
  kp_cage: 0.90
  kp_transport: 0.60

  push_side_threshold: 0.35
  min_push_agents: 3
  contact_band_tolerance: 0.08
  transport_speed: 0.05
  transport_dwell_steps: 35
  transport_distance: 0.30

transport:
  engine: penalty
  stiffness: 500.0
  damping: 12.0
  friction: 0.6
  tangential_stiffness: 60.0
  ground_friction: 0.77
  gravity: 9.81
  substeps: 4

evaluation:
  contact_radius: 0.42
  j_min: 0.15
  j_max: 0.60
  efficiency_min: 0.7
  displacement_gate: 0.1
  coverage_min: 0.70
  max_rotation_deg: 5.0
