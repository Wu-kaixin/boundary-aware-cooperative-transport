# End-to-end DBACT enclosure + PyMunk transport of a concave L-shaped cargo
domain:
  xmin: 0.0
  xmax: 8.0
  ymin: 0.0
  ymax: 8.0
dt: 0.05
seed: 1
agents:
  count: 12
  layout: grid
  center: [3.2, 3.2]
  spacing: 0.32
  jitter: 0.01
controller:
  method: dbact
  sensor_range: 1.3
  comm_range: 1.6
  cage_offset: 0.28
  sigma: 0.32
  d_min: 0.28
  max_speed: 0.40
  kp_explore: 0.30
  kp_cage: 1.0
  kp_transport: 0.08
  grid_spacing: 0.08
  map_ttl: 4.0
  map_voxel_size: 0.08
  enable_transport_bias: true
  transport_activation_time: 12.5
  cbf_use_qp: true
  robot_radius: 0.12
  cbf_contact_allowance: 0.08
transport:
  backend: pymunk
  contact_radius: 0.40
  coverage_threshold: 0.35
  min_contact_agents: 2
  robot_radius: 0.12
  cargo_mass: 6.0
  cargo_friction: 0.9
  linear_damping: 0.55
  angular_damping: 0.85
  substeps: 4
evaluation:
  enclosure_threshold: 0.45
  require_transport: true
  min_displacement: 0.15
cargoes:
  - id: cargo_0
    shape: l_shape
    center: [2.0, 2.0]
    scale: 0.80
    transport_direction: [1.0, 0.0]
