# B1: global geometry-aware CVT oracle
domain:
  xmin: 0.0
  xmax: 8.0
  ymin: 0.0
  ymax: 8.0
dt: 0.05
seed: 1
agents:
  count: 12
  layout: grid
  center: [4.0, 4.0]
  spacing: 0.35
  jitter: 0.02
controller:
  method: oracle
  sensor_range: 1.2
  comm_range: 1.6
  cage_offset: 0.32
  sigma: 0.35
  d_min: 0.28
  max_speed: 0.35
  kp_explore: 0.28
  kp_cage: 0.95
  kp_transport: 0.22
  grid_resolution: 34
  enable_transport_bias: true
  cbf_use_qp: true
transport:
  backend: scripted
  contact_radius: 0.42
  coverage_threshold: 0.40
  min_contact_agents: 3
  speed: 0.16
evaluation:
  enclosure_threshold: 0.50
cargoes:
  - id: cargo_0
    shape: nonconvex
    center: [2.2, 2.2]
    scale: 0.95
    transport_direction: [1.0, 0.25]
