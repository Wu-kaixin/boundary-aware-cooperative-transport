# Wall-corner pressure scene for theorem_mode.
# Cargo near the corner; robots start between the object and the walls so wall
# rows and inter-robot rows are both live. Object frozen; map = oracle.

paper: false
dt: 0.05

domain:
  xmin: 0.0
  xmax: 8.0
  ymin: 0.0
  ymax: 8.0

agents:
  count: 6
  layout: ring
  center: [1.55, 1.55]
  radius_min: 0.95
  radius_max: 0.95
  min_separation: 0.34

cargoes:
  - id: cargo_0
    shape: rectangle
    center: [1.20, 1.20]
    width: 0.90
    height: 0.90
    surface_density: 2.0
    movable: false

task:
  mode: fixed
  goal_directions:
    cargo_0: [1.0, 0.0]

controller:
  task_mode: caging
  theorem_mode: true
  theorem_map_source: oracle
  theorem_oracle_spacing: 0.04
  theorem_disable_clipping: true
  theorem_forbid_fallback: true
  theorem_allow_object_barrier_scaling: true
  theorem_disable_soft_separation: true

  sensor_range: 1.20
  ray_count: 72
  range_noise_std: 0.0
  pca_neighbors: 5
  residual_tolerance: 0.030
  min_confidence: 0.15
  comm_range: 1.60

  voxel_size: 0.06
  age_decay: 0.30
  max_voxels_per_object: 320
  motion_compensation: false
  max_object_speed: 0.0
  carve_enabled: false

  density_mode: offset
  cage_offset: 0.105
  lead_offset: null
  sigma: 0.20
  base_density: 0.001
  gap_gain: 0.0
  explore_gain: 0.0

  local_radius: 0.80
  grid_resolution: 20

  robot_radius: 0.13
  delta_max: 0.065
  d_min: 0.28
  gamma_agent: 6.0
  gamma_obj: 8.0
  rho: 0.02
  max_speed: 0.35
  backend: qp
  object_row_range: 0.60
  object_row_window: 0.28
  max_object_rows: 8
  object_velocity_bound: 0.0

  kp_cage: 0.90
  kp_separate: 0.0

transport:
  engine: penalty
  stiffness: 500.0
  damping: 12.0
  friction: 0.6
  tangential_stiffness: 60.0
  ground_friction: 0.60
  gravity: 9.81
  substeps: 4

render:
  map_agent: agent_00

evaluation:
  contact_radius: 0.42
  j_min: 0.0
  efficiency_min: 0.0
  displacement_gate: 0.0
