# conda env create -f environment.yml
# conda activate dbact
# pytest -q
#
# cvxpy/osqp and pymunk are required, not optional. The C2 contract makes a
# requested QP backend fail rather than degrade, and the pymunk engine is the
# independent cross-check on the contact model -- neither can be "install it if
# you feel like it" without weakening a claim the paper makes.
name: dbact
channels: [conda-forge]
dependencies:
  - python=3.10
  - numpy>=1.26
  - scipy>=1.13
  - matplotlib>=3.9
  - pyyaml>=6.0
  - pandas>=2.2
  - shapely>=2.0
  - pytest>=8.0
  - pip
  - pip:
      - cvxpy>=1.4
      - osqp>=0.6
      - pymunk>=6.6
      - imageio-ffmpeg==0.6.0
      - -e .
